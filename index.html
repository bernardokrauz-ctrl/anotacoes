<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Vistoria por Voz</title>
<style>
  :root{
    --teal:#0f766e; --teal-d:#0b5a54; --teal-l:#e6f4f2;
    --bg:#f4f7f6; --card:#fff; --ink:#16211f; --mut:#62726f; --line:#dbe5e2;
    --red:#dc2626; --amber:#b45309;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;overscroll-behavior:none}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

  header{background:var(--teal);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    display:flex;align-items:center;gap:8px}
  #title{flex:1;min-width:0;font-size:17px;font-weight:700;background:transparent;border:0;color:#fff;
    padding:6px 4px;border-bottom:1px dashed rgba(255,255,255,.4);outline:none}
  .hbtn{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;white-space:nowrap}
  .hbtn:active{background:rgba(255,255,255,.3)}

  #chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);
    scrollbar-width:none;flex:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--mut)}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .chip.add{border-style:dashed;color:var(--teal)}
  #hint{font-size:12px;color:var(--mut);padding:6px 14px 0;flex:none}
  #hint b{color:var(--teal)}

  main{flex:1;overflow-y:auto;padding:8px 12px 190px;-webkit-overflow-scrolling:touch}
  .group{margin:12px 0 4px}
  .ghead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--teal);margin:0 2px 6px}
  .ghead span{background:var(--teal-l);border-radius:999px;padding:1px 8px;font-size:12px}
  .note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px 12px;margin-bottom:8px;
    display:flex;gap:8px;align-items:flex-start}
  .ntxt{flex:1;min-width:0;outline:none;word-break:break-word;padding:2px 0}
  .ntxt:focus{background:#fffbe6;border-radius:6px}
  .nside{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:none}
  .nside select{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:3px 4px;background:#fff;color:var(--mut);max-width:104px}
  .nside .time{font-size:11px;color:var(--mut)}
  .del{color:var(--red);font-size:13px;font-weight:600;padding:2px 4px}
  .empty{text-align:center;color:var(--mut);padding:42px 20px}
  .empty big{display:block;font-size:42px;margin-bottom:8px}

  #dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:8px}
  #live{min-height:20px;font-size:14px;color:var(--teal-d);font-style:italic;padding:0 4px;word-break:break-word}
  #row{display:flex;gap:8px;align-items:center}
  #txt{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;outline:none;background:#fff}
  #txt:focus{border-color:var(--teal)}
  #send{background:var(--teal-l);color:var(--teal-d);font-weight:700;border-radius:12px;padding:12px 14px}
  #mic{width:62px;height:62px;border-radius:50%;background:var(--teal);color:#fff;font-size:28px;flex:none;
    box-shadow:0 4px 14px rgba(15,118,110,.45);display:grid;place-items:center}
  #mic.rec{background:var(--red);box-shadow:0 0 0 0 rgba(220,38,38,.6);animation:pulse 1.4s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 16px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}

  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:#16211f;color:#fff;
    padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90%;text-align:center}
  #toast.show{opacity:.95}

  dialog{border:0;border-radius:16px;padding:0;width:min(92vw,420px);max-height:80vh;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dh{padding:14px 16px;font-weight:800;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .db{padding:10px 14px 14px;overflow-y:auto;max-height:60vh}
  .hist{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .hist.cur{border-color:var(--teal);background:var(--teal-l)}
  .hist .hinfo{flex:1;min-width:0}
  .hist .hinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist .hinfo small{color:var(--mut)}
  .btn{background:var(--teal);color:#fff;font-weight:700;border-radius:12px;padding:12px 14px;width:100%;margin-top:8px}
  .btn.sec{background:var(--teal-l);color:var(--teal-d)}
  .mini{background:var(--teal-l);color:var(--teal-d);font-weight:700;border-radius:8px;padding:6px 10px;font-size:13px}
  .mini.red{background:#fee2e2;color:var(--red)}
  #unsupported{display:none;background:#fff7ed;color:var(--amber);border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;margin:8px 12px 0;font-size:14px}
</style>
</head>
<body>
<header>
  <input id="title" aria-label="Nome da vistoria" maxlength="60">
  <button class="hbtn" id="btnPdf">PDF</button>
  <button class="hbtn" id="btnHist">Histórico</button>
</header>

<div id="chips"></div>
<div id="hint"></div>
<div id="unsupported">Este navegador não tem reconhecimento de voz. Abra no <b>Chrome</b> (Android) para ditar. Você ainda pode digitar as notas.</div>

<main id="list"></main>

<div id="dock">
  <div id="live"></div>
  <div id="row">
    <input id="txt" placeholder="Ou digite uma nota…" enterkeyhint="send" autocomplete="off">
    <button id="send">Add</button>
    <button id="mic" aria-label="Gravar">🎤</button>
  </div>
</div>

<div id="toast"></div>

<dialog id="dlgHist">
  <div class="dh">Vistorias <button class="mini" id="histClose">Fechar</button></div>
  <div class="db">
    <div id="histList"></div>
    <button class="btn" id="btnNew">+ Nova vistoria</button>
  </div>
</dialog>

<dialog id="dlgPdf">
  <div class="dh">PDF pronto <button class="mini" id="pdfClose">Fechar</button></div>
  <div class="db">
    <div id="pdfInfo" style="color:var(--mut);font-size:14px;margin-bottom:4px"></div>
    <button class="btn" id="pdfShare">Compartilhar (WhatsApp, e-mail…)</button>
    <button class="btn sec" id="pdfSave">Baixar PDF</button>
    <button class="btn sec" id="pdfView">Abrir para visualizar</button>
  </div>
</dialog>

<script src="jspdf.umd.min.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
